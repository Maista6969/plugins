name: Doppelganger
description: Finds scenes, performers, tags, and studios matched to the same stash-box entry more than once, and scenes hiding identical copies of the same file. Merges through Stash's own dialogs and deletes copies through Stash's own file deletion.
# version: injected from package.json at build time
url: https://github.com/example/doppelganger
ui:
  javascript:
    - doppelganger-ui.js
  css:
    - doppelganger-ui.css
