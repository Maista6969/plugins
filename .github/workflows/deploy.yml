name: Build and deploy plugin repository to GitHub Pages

on:
  push:
    branches:
      - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # build_site.sh reads each plugin's git history (last commit
          # touching its own top-level source directory) to compute the
          # published version/date -- needs full history, not a shallow clone.
          fetch-depth: '0'

      - uses: pnpm/action-setup@v4
        # Version is read from this repo's root package.json "packageManager"
        # field -- no version pinned here so it can't drift out of sync with
        # what's actually used locally.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every plugin is a pnpm workspace member (pnpm-workspace.yaml matches
      # every top-level folder with a package.json) -- this builds all of
      # them, not a hardcoded list, so a new plugin folder is picked up with
      # no workflow changes.
      - name: Build every plugin
        run: pnpm -r build

      # plugins/ is what build_site.sh scans -- assembled fresh from each
      # plugin's own <name>/dist/, never committed (see root README).
      - name: Assemble plugins/ from each plugin's dist/
        run: |
          shopt -s nullglob
          mkdir -p plugins
          for d in */dist; do
            plugin="$(dirname "$d")"
            cp -r "$d" "plugins/$plugin"
          done
          ls plugins

      - name: Build site (index.yml + zips)
        run: |
          chmod +x build_site.sh
          ./build_site.sh "_site/${{ github.ref_name }}"

      - uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      # Points the environment's URL badge straight at the published source
      # index, not just the Pages site root (matches upstream template).
      url: ${{ steps.deployment.outputs.page_url }}main/index.yml
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
